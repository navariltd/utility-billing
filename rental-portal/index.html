<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Rental Portal | Utility Billing & Property Management</title>
		<meta
			name="description"
			content="Streamline your utility billing, property leasing, and tenant management with our ERPNext-powered portal."
		/>

		<!-- Favicons -->
		<link rel="icon" type="image/png" href="/assets/utility_billing/logo.png" />
		<link rel="apple-touch-icon" href="/assets/utility_billing/logo.png" />

		<!-- Theme colors -->
		<meta name="msapplication-TileColor" content="#000000" />
		<meta name="theme-color" content="#191919" />

		<!-- iOS / PWA support -->
		<meta name="apple-itunes-app" content="app-id=6741682327, app-argument={{sitename}}" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="screen-orientation" content="portrait" />
		<meta name="mobile-web-app-capable" content="yes" />
	</head>

	<body>
		<div id="root" vaul-drawer-wrapper="true"></div>

		<script>
			window.csrf_token = '{{ csrf_token }}';
			if (!window.frappe) window.frappe = {};
			window.app_name = "{{ app_name }}";

			// Boot data from Frappe backend
			frappe.boot = JSON.parse({{ boot }});
		</script>

		<!-- React entry point -->
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
